name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
            sha256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
          - runner: macos-15
            artifact: macos-arm64
            sha256: b276c6ac87c3eea17446a6ca9080089b6e9f492057fb773591775ee49d92a1cf
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux raylib dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev
      - name: Install pinned Odin
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-${ARTIFACT}-dev-2026-10.tar.gz"
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "$SHA256  $RUNNER_TEMP/odin.tar.gz" | shasum -a 256 -c
          else
            echo "$SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c
          fi
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/odin" version | grep -F 'dev-2026-10-nightly:84bc3fc'
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: Test
        run: make test
      - name: Check
        run: make check
      - name: Build
        run: make build
